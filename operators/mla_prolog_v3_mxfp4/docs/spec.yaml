broadcast:
  kind: none
math_semantics:
  formula_kind: textual_only
  formula: 'D4(P,S) decodes logical E2M1 values and multiplies one E8M0 scale per
    K32 group.

    Zq = BF16(D4(token_x,dequant_scale_x) @ D4(weight_dq,dequant_scale_w_dq)); FP32
    Cube accumulation then F322BF16 Fixpipe.

    Cq = BF16(RMSNorm(Zq,rmsnorm_gamma_cq,rmsnorm_epsilon_cq)); query_norm=Cq if query_norm_flag
    else empty.

    Iq,Sq = Q4(Cq), with the same block/round rules as the actual npu_dynamic_mx_quant
    producer.

    U = BF16(D4(Iq,Sq) @ D4(weight_uq_qr,dequant_scale_w_uq_qr)); split by N,D,Dr.

    query = BF16(U_nope @ weight_uk), query_rope = BF16(RoPE(U_rope,rope_sin,rope_cos)).

    Zkv = BF16(D4(token_x,dequant_scale_x) @ D4(weight_dkv_kr,dequant_scale_w_dkv_kr));
    split Hckv and Dr.

    K = RMSNorm(Zkv_latent,rmsnorm_gamma_ckv,rmsnorm_epsilon_ckv); Kr=RoPE(Zkv_rope,rope_sin,rope_cos).

    Preserve existing qc_qr_scale,kc_scale placements (first scope both 1).

    Scatter K,Kr through cache_index to kv_cache,kr_cache using existing kv_cache_quant_mode,
    ckvkr_repo_mode,

    quant_scale_repo_mode,tile_size,quant_scale_ckv,quant_scale_ckr,k_nope_clip_alpha,actual_seq_len
    contracts.

    smooth_scales_cq must not be silently applied to MXFP4; unsupported nonempty values
    require rejection.

    dequant_scale_q_norm and dequant_scale_q_nope are empty in the target query mode.

    This is a non-executable draft: unresolved Q4 rounding/NZ/cache details are explicitly
    not certified by formula smoke testing.

    Q4 locks scaleAlg=0 OCP, K32, emax exponent 2, hardware CAST_ROUND E2M1.

    Use the source ComputeScaleOCP and ComputeDataMxfp4General rules, including NaN/Inf
    scale 0xff,

    sharedExp==0 reciprocal zero, saturation/subnormal/tie semantics of hardware Cast.

    Do not substitute NumPy round for hardware CAST_ROUND.

    The three FP4 GEMMs accumulate FP32 and materialize BF16 before RMSNorm, Q split/RoPE
    or later BF16 matmul,

    matching native QuantMatmul output dtype. query_norm copies pre-Q4 BF16 Cq into
    an independent GM output.


    actual_seq_len must be absent/empty (IR INT32); nonempty is rejected by the new
    mode. Cache slot -1 is skip-write; other slots require 0<=slot<Pages*Block. Host
    does not promise value-range errors for device cache_index.

    '
  reference_oracle:
    framework: torch
    available_for_dtype:
    - float4_e2m1
    absent: true
    reason: No verified single callable equivalent to new fused MXFP4 Prolog; native
      torch_npu composition needs A5. Do not use torch.matmul alone as oracle.
  invariants:
  - name: zero_hidden_query
    kind: equals_when_input_is_zero
    input: token_x
    output: query
    value: 0
    preconditions: Finite weights/scales, positive eps, canonical zero handling; excludes
      untouched cache entries.
  composition:
    primitives:
    - id: decode
      op: mx_dequantize
      inputs:
      - token_x
      - weight_dq
      - weight_uq_qr
      - weight_dkv_kr
      - dequant_scale_x
      - dequant_scale_w_dq
      - dequant_scale_w_uq_qr
      - dequant_scale_w_dkv_kr
      outputs:
      - x_dec
      - wdq_dec
      - wuq_dec
      - wkv_dec
    - id: down_q
      op: gemm
      inputs:
      - x_dec
      - wdq_dec
      outputs:
      - zq
    - id: norm_q
      op: rms_norm
      inputs:
      - zq
      - rmsnorm_gamma_cq
      outputs:
      - cq
    - id: retain_norm
      op: cast
      inputs:
      - cq
      outputs:
      - query_norm
    - id: quant_q
      op: mx_quantize
      inputs:
      - cq
      outputs:
      - iq
      - sq
    - id: up_q
      op: mx_gemm
      inputs:
      - iq
      - sq
      - wuq_dec
      - weight_uk
      - rope_sin
      - rope_cos
      outputs:
      - query
      - query_rope
    - id: down_kv
      op: gemm
      inputs:
      - x_dec
      - wkv_dec
      outputs:
      - zkv
    - id: kv_norm_rope_scatter
      op: scatter_update
      inputs:
      - zkv
      - rmsnorm_gamma_ckv
      - rope_sin
      - rope_cos
      - cache_index
      - kv_cache
      - kr_cache
      - quant_scale_ckv
      - quant_scale_ckr
      - actual_seq_len
      - k_nope_clip_alpha
      outputs:
      - kv_cache_out
      - kr_cache_out
    dataflow:
      intermediates:
      - x_dec
      - wdq_dec
      - wuq_dec
      - wkv_dec
      - zq
      - cq
      - iq
      - sq
      - zkv
      no_leak: true
  contract_open_items:
  - Dedicated decoded-reference plus A5 hardware quant/native oracle execution
  - New kernel T routing boundary verification
  - Actual CANN/torch_npu version and hardware tolerance/performance results
  status: 'Draft only: semantic primitives intentionally use honest names unsupported
    by current generic registry; do not disguise them as elementwise_unary for a false
    PASS.'
  source_contract:
    ops_nn_ref: 2a77283db46e6648ff47bc8277442cf9c721e3c2
    nz: 'matmul/quant_batch_matmul_v3/op_api/quant_matmul_v4_common.h::SelectNzK0Value/GetWeightNzShape:
      A4W4 C0=64, non-transposed weight logical [K,N] storage [N/64,K/16,16,64] logical
      FP4 elements (half-byte each); do not apply A8W4 C0=32.'
    quant: norm/rms_norm_dynamic_mx_quant/op_kernel/arch35/rms_norm_dynamic_mx_quant_common.h::ComputeScaleOCP/ComputeDataMxfp4General;
      quant/dynamic_mx_quant/docs/aclnnDynamicMxQuant.md
    scales: GM logical [T,K/32] uint8 E8M0 bit storage. L1 pair of E8M0 bytes reinterpreted
      BF16 for Dn2Nz; LoadDataMX yStep=K/64. This is a storage reinterpretation, not
      numerical BF16 scale.
    tiling: New semantic combination enum16/17 may use SCENARIO=3 plus existing QUANT_MODE
      low field0/1 for KV0/3. Preserve old field bit positions; verify host/device
      dispatch and shared V1-V4 regressions.
    cache: ops-transformer@632dddba attention/mla_prolog/op_host/mla_prolog_tiling_check.cpp
      CheckBaseShape/CheckHcqSize/CheckDSize/GenActualParamInfo/CheckSpecialScenarParamInfo;
      PA_BSND KV3 Dtile=512+64*2+512/128*4=656.
