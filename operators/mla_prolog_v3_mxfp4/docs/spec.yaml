attributes:
- name: weight_quant_mode
  type: int64
  semantics: This extension allocates 6 = MXFP4_FULL_QUANT; upstream 0..5 unchanged;
    6 is not supported by the upstream baseline.
  default: 6
- name: kv_cache_quant_mode
  type: int64
  semantics: Target scope {0 BF16,3 existing FP8 per-tile}; physical cache contract
    needs full source lock.
  default: 0
- name: query_quant_mode
  type: int64
  semantics: Only 0 in new mode.
  default: 0
- name: query_norm_flag
  type: bool
  semantics: 'IR flag: emit BF16 RMSNorm result before FP4 requantization; ACLNN derives
    from optional output.'
  default: true
- name: cache_mode
  type: string
  semantics: Only PA_BSND targeted. NoPE still gated in VA.
  default: PA_BSND
- name: ckvkr_repo_mode
  type: int64
  semantics: Preserve existing mode-dependent repository/tile semantics; not an MXFP4
    cache attribute.
- name: quant_scale_repo_mode
  type: int64
  semantics: Preserve existing mode-dependent repository/tile semantics; not an MXFP4
    cache attribute.
- name: tile_size
  type: int64
  semantics: Preserve existing mode-dependent repository/tile semantics; not an MXFP4
    cache attribute.
- name: rmsnorm_epsilon_cq
  type: float32
  semantics: Positive RMSNorm epsilon; public ACLNN is double. No invented default.
- name: rmsnorm_epsilon_ckv
  type: float32
  semantics: Positive RMSNorm epsilon; public ACLNN is double. No invented default.
- name: qc_qr_scale
  type: float32
  semantics: First VA deployment scope is 1; retain existing scale placement semantics.
  default: 1.0
- name: kc_scale
  type: float32
  semantics: First VA deployment scope is 1; retain existing scale placement semantics.
  default: 1.0
