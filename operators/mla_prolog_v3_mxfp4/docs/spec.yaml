- case: reduce axis length 1 violates K32
  synthesize:
    token_x.shape: '[1,1]'
  machine_check:
    kind: raises_error
    error_type: shape_mismatch
- case: empty input unsupported in initial draft
  synthesize:
    token_x.shape: '[0,32]'
  machine_check:
    kind: raises_error
    error_type: shape_mismatch
  tags:
  - empty_tensor
- case: K=0 unsupported
  synthesize:
    token_x.shape: '[1,0]'
  machine_check:
    kind: raises_error
    error_type: shape_mismatch
- case: K dimension mismatch
  tags:
  - k_mismatch_raises
  synthesize:
    token_x.shape: '[1,32]'
    weight_dq.shape: '[64,64]'
  machine_check:
    kind: raises_error
    error_type: shape_mismatch
extreme_inputs:
- case: 'zero_input: finite zero token input makes query zero with canonical MX zero
    policy'
  tags:
  - zero_input
  synthesize:
    shapes:
      token_x: '[1,32]'
    patterns:
    - pattern: all_zero
      target: token_x
